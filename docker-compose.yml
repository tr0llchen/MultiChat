services:
  multichat:
    build: .
    image: multichat
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Encrypts the provider API keys. If unset, a key is generated and stored in the data volume.
      APP_SECRET: ${APP_SECRET:-}
      # Set to "true" when the app is served over HTTPS (behind a reverse proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - multichat-data:/data
    extra_hosts:
      # Lets the container reach services on the host, such as a local Ollama server.
      - "host.docker.internal:host-gateway"

volumes:
  multichat-data:
